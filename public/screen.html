<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>사연 상영 | 관객-반응-디피 시스템 (관반디)</title><link rel="stylesheet" href="/jungang-memory/style.css"><link rel="stylesheet" href="/jungang-memory/theater.css"><script src="/jungang-memory/theater.js" defer></script><script src="/jungang-memory/event-player.js" defer></script></head>
<body data-page="screen" data-theater="story" class="screen-page theater-page projector-view">
<main class="projector" id="projector" aria-label="사연 상영 화면"><div class="stage-view"><div id="theater-canvas" class="theater-canvas">
<div id="scene-backdrop" hidden></div><div id="story-stage" class="screen-body" hidden><section class="screen-memory" aria-label="지금 상영하는 사연"><p id="screen-eyebrow" hidden></p><p id="screen-story-title" hidden></p><blockquote id="screen-text"></blockquote><p id="screen-nickname" class="screen-nickname"></p><p id="screen-position" hidden></p></section></div>
<section id="ending-stage" class="ending-stage" aria-label="함께한 관객" hidden><div id="credits-window" class="credits-window"><div id="credits-roll" class="credits-roll"></div></div></section>
<section id="reading-stage" class="ending-stage" aria-label="관리자 선택 낭독 원고" hidden><div id="reading-window" class="credits-window"><div id="reading-roll" class="credits-roll"></div></div></section>
</div></div></main>
</body></html>
